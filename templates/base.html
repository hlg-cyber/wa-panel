<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WA Panel{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        (function() {
            const path = window.location.pathname;
            const publicPaths = ['/login', '/register'];
            const isPublicPage = publicPaths.includes(path);
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');

            if (isPublicPage) return;
            if (!token) { window.location.href = '/login'; return; }

            if (role === 'super_admin' && path.startsWith('/ui/client-')) {
                window.location.href = '/ui/dashboard';
            }
            if (role === 'client_admin' && (
                path === '/ui/dashboard' ||
                path === '/ui/api-managers' ||
                path === '/ui/wabas' ||
                path === '/ui/clients'
            )) {
                window.location.href = '/ui/client-dashboard';
            }
        })();
    </script>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen">
    {% block body %}{% endblock %}

    <script>
        // ============== HELPER API ==============
        async function apiFetch(url, options = {}) {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/login'; return null; }
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
                ...(options.headers || {})
            };
            const res = await fetch(url, {...options, headers});
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = '/login';
                return null;
            }
            return res;
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        // ============== BADGE POLLING ==============
        async function updateBadges() {
            const role = localStorage.getItem('role');
            const token = localStorage.getItem('token');
            if (!token) return;

            if (role === 'super_admin') {
                const badge = document.getElementById('adminChatBadge');
                if (!badge) return;
                try {
                    const res = await fetch('/chat/admin/unread-count', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.unread > 0) {
                            badge.textContent = data.unread;
                            badge.classList.remove('hidden');
                        } else {
                            badge.classList.add('hidden');
                        }
                    }
                } catch (e) { console.error('Badge admin error:', e); }
            } else if (role === 'client_admin') {
                const badge = document.getElementById('clientChatBadge');
                if (!badge) return;
                try {
                    const res = await fetch('/chat/my-unread-count', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.unread > 0) {
                            badge.textContent = data.unread;
                            badge.classList.remove('hidden');
                        } else {
                            badge.classList.add('hidden');
                        }
                    }
                } catch (e) { console.error('Badge client error:', e); }
            }
        }

        // Jalankan setelah DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            updateBadges();
            setInterval(updateBadges, 10000);  // refresh tiap 10 detik
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
