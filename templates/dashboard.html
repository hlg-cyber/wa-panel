{% extends "base.html" %}
{% block title %}Dashboard - WA Panel{% endblock %}
{% block body %}
<div class="flex min-h-screen" x-data="dashboard()" x-init="load()">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex-shrink-0">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold">WA Panel</h1>
            <p class="text-xs text-gray-400 mt-1" x-text="email"></p>
        </div>
        <nav class="p-4 space-y-1">
            <a href="/ui/dashboard" class="block px-4 py-2 rounded bg-blue-600">📊 Dashboard</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-800">⚙️ API Manager</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-800">📱 WABA</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-800">👥 Klien</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-gray-800">📈 Monitoring</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button @click="logout" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded text-sm">Logout</button>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Dashboard</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-6 rounded-xl shadow">
                <div class="text-3xl font-bold text-blue-600" x-text="stats.total_api_managers">0</div>
                <div class="text-gray-500 text-sm mt-1">API Manager</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <div class="text-3xl font-bold text-green-600" x-text="stats.active_clients">0</div>
                <div class="text-gray-500 text-sm mt-1">Klien Aktif</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <div class="text-3xl font-bold text-purple-600" x-text="stats.total_wabas">0</div>
                <div class="text-gray-500 text-sm mt-1">Total WABA</div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow">
            <h3 class="font-semibold text-gray-700 mb-4">Quality Rating WABA</h3>
            <div class="flex gap-6">
                <div><span class="text-2xl">🟢</span> <span class="font-bold" x-text="stats.wabas_green"></span> Green</div>
                <div><span class="text-2xl">🟡</span> <span class="font-bold" x-text="stats.wabas_yellow"></span> Yellow</div>
                <div><span class="text-2xl">🔴</span> <span class="font-bold" x-text="stats.wabas_red"></span> Red</div>
            </div>
        </div>
    </main>
</div>

<script>
function dashboard() {
    return {
        email: localStorage.getItem('email') || '',
        stats: {
            total_api_managers: 0,
            active_clients: 0,
            total_wabas: 0,
            wabas_green: 0,
            wabas_yellow: 0,
            wabas_red: 0,
        },
        async load() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            const res = await fetch('/dashboard/stats', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = '/login';
                return;
            }
            this.stats = await res.json();
        },
        logout() {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
}
</script>
{% endblock %}
