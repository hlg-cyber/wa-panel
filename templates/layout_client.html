{% extends "base.html" %}
{% block body %}
<div class="flex min-h-screen">
    <aside class="w-64 bg-gradient-to-b from-blue-900 to-blue-800 text-white flex-shrink-0">
        <div class="p-6 border-b border-blue-700">
            <h1 class="text-xl font-bold">WA Panel</h1>
            <p class="text-xs text-blue-200 mt-1">Klien Dashboard</p>
            <p class="text-xs text-blue-300 mt-2" id="userEmail"></p>
        </div>
        <nav class="p-4 space-y-1 text-sm">
            <a href="/ui/client-dashboard" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-dashboard">📊 Dashboard</a>
            <a href="/ui/client-chat" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700 relative" data-path="/ui/client-chat">
                💬 Chat Admin
                <span id="clientChatBadge" class="hidden absolute right-2 top-1/2 -translate-y-1/2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </a>
            <a href="/ui/client-wabas" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-wabas">📱 WABA Saya</a>
            <a href="/ui/client-chat-wa" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-chat-wa">💌 Chat WhatsApp</a>
            <a href="/ui/client-send-message" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-send-message">📤 Kirim Pesan</a>
            <a href="/ui/client-broadcast" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-broadcast">📢 Broadcast</a>
            <a href="/ui/client-contacts" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-contacts">📇 Kontak</a>
            <a href="/ui/client-templates" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-templates">📝 Template</a>
            <a href="/ui/client-logs" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-logs">📨 Log Pesan</a>
        </nav>
        <div class="p-4 border-t border-blue-700">
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded text-sm">Logout</button>
        </div>
    </aside>

    <main class="flex-1 p-8">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
    document.getElementById('userEmail').textContent = localStorage.getItem('email') || '';
    const currentPath = window.location.pathname;
    document.querySelectorAll('.sidebar-link').forEach(link => {
        if (currentPath.startsWith(link.dataset.path)) {
            link.classList.add('bg-blue-600');
            link.classList.remove('hover:bg-blue-700');
        }
    });
</script>
{% endblock %}
