{% extends "base.html" %}
{% block body %}
<div class="flex min-h-screen">
    <aside class="w-64 bg-gradient-to-b from-blue-900 to-blue-800 text-white flex-shrink-0">
        <div class="p-6 border-b border-blue-700">
            <h1 class="text-xl font-bold">WA Panel</h1>
            <p class="text-xs text-blue-200 mt-1">Klien Dashboard</p>
            <p class="text-xs text-blue-300 mt-2" id="userEmail"></p>
        </div>
        <nav class="p-4 space-y-1">
            <a href="/ui/client-dashboard" class="sidebar-link block px-4 py-2 rounded hover:bg-blue-700" data-path="/ui/client-dashboard">📊 Dashboard</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-blue-700 opacity-50 cursor-not-allowed" title="Coming soon">📱 WABA Saya</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-blue-700 opacity-50 cursor-not-allowed" title="Coming soon">📝 Template Pesan</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-blue-700 opacity-50 cursor-not-allowed" title="Coming soon">📤 Broadcast</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-blue-700 opacity-50 cursor-not-allowed" title="Coming soon">📇 Kontak</a>
            <a href="#" class="block px-4 py-2 rounded hover:bg-blue-700 opacity-50 cursor-not-allowed" title="Coming soon">📨 Log Pesan</a>
        </nav>
        <div class="p-4 border-t border-blue-700">
            <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded text-sm">Logout</button>
        </div>
    </aside>

    <main class="flex-1 p-8">
        {% block content %}{% endblock %}
    </main>
</div>

<script>
    document.getElementById('userEmail').textContent = localStorage.getItem('email') || '';
    const currentPath = window.location.pathname;
    document.querySelectorAll('.sidebar-link').forEach(link => {
        if (link.dataset.path === currentPath) {
            link.classList.add('bg-blue-600');
            link.classList.remove('hover:bg-blue-700');
        }
    });
</script>
{% endblock %}
