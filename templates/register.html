{% extends "base.html" %}
{% block title %}Daftar - WA Panel{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-500 to-blue-700 py-8">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md" x-data="registerForm()">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Daftar Akun</h1>
            <p class="text-gray-500 mt-1">Buat akun klien baru</p>
        </div>

        <template x-if="error">
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm" x-text="error"></div>
        </template>

        <form @submit.prevent="submit">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Bisnis / Klien *</label>
                <input type="text" x-model="name" required minlength="3"
                    placeholder="Contoh: PT ABC Sejahtera"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1">Minimal 3 karakter.</p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                <input type="email" x-model="admin_email" required
                    placeholder="admin@ptabc.com"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1">Email ini untuk login.</p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
                <input type="password" x-model="admin_password" required minlength="8"
                    placeholder="Minimal 8 karakter"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1">Minimal 8 karakter.</p>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi Password *</label>
                <input type="password" x-model="confirm_password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6 flex items-start gap-2">
                <input type="checkbox" x-model="agree" required id="agree" class="mt-1">
                <label for="agree" class="text-xs text-gray-600">
                    Saya setuju dengan <a href="#" class="text-blue-600 hover:underline">Syarat & Ketentuan</a> dan <a href="#" class="text-blue-600 hover:underline">Kebijakan Privasi</a>
                </label>
            </div>

            <button type="submit" :disabled="loading || !agree"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold disabled:opacity-50">
                <span x-show="!loading">Daftar Sekarang</span>
                <span x-show="loading">Mendaftarkan...</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-gray-200">
            <p class="text-sm text-gray-600">
                Sudah punya akun?
                <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold">Login di sini</a>
            </p>
        </div>
    </div>
</div>

<script>
function registerForm() {
    return {
        name: '',
        admin_email: '',
        admin_password: '',
        confirm_password: '',
        agree: false,
        loading: false,
        error: '',
        async submit() {
            this.loading = true;
            this.error = '';

            // Validasi lokal
            if (this.admin_password !== this.confirm_password) {
                this.error = 'Password dan konfirmasi tidak sama';
                this.loading = false;
                return;
            }
            if (this.admin_password.length < 8) {
                this.error = 'Password minimal 8 karakter';
                this.loading = false;
                return;
            }

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: this.name,
                        admin_email: this.admin_email,
                        admin_password: this.admin_password,
                    })
                });
                const data = await res.json();
                if (!res.ok) {
                    this.error = data.detail || 'Pendaftaran gagal';
                    return;
                }
                // Auto-login: simpan token langsung
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('email', data.email);
                if (data.client_id) localStorage.setItem('client_id', data.client_id);
                window.location.href = '/ui/client-dashboard';
            } catch (e) {
                this.error = 'Koneksi gagal: ' + e.message;
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
