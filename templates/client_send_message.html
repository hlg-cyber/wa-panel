{% extends "layout_client.html" %}
{% block title %}Kirim Pesan{% endblock %}
{% block content %}
<div x-data="sendMessage()" x-init="loadWabas()">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">💬 Kirim Pesan</h2>

    <div class="bg-white p-6 rounded-xl shadow max-w-2xl">
        <template x-if="successMsg">
            <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded mb-4 text-sm" x-text="successMsg"></div>
        </template>
        <template x-if="error">
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm" x-text="error"></div>
        </template>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Pilih WABA *</label>
                <select x-model="form.waba_id" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="">-- Pilih WABA --</option>
                    <template x-for="w in wabas" :key="w.id">
                        <option :value="w.id" x-text="`${w.display_phone_number || w.waba_id} (${w.display_name || 'No Name'})`"></option>
                    </template>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipe Pesan</label>
                <select x-model="form.message_type" class="w-full px-4 py-2 border rounded-lg">
                    <option value="text">📝 Text</option>
                    <option value="template">📋 Template</option>
                    <option value="image">🖼️ Image URL</option>
                    <option value="document">📄 Document URL</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Tujuan * (6281234567890)</label>
                <input type="text" x-model="form.to" required class="w-full px-4 py-2 border rounded-lg font-mono">
            </div>

            <template x-if="form.message_type === 'text'">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Isi Pesan *</label>
                    <textarea x-model="form.text" rows="4" class="w-full px-4 py-2 border rounded-lg"></textarea>
                </div>
            </template>

            <template x-if="form.message_type === 'template'">
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nama Template *</label>
                        <input type="text" x-model="form.template_name" class="w-full px-4 py-2 border rounded-lg font-mono">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bahasa</label>
                        <input type="text" x-model="form.template_language" class="w-full px-4 py-2 border rounded-lg" value="id">
                    </div>
                </div>
            </template>

            <template x-if="form.message_type === 'image' || form.message_type === 'document'">
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Media URL *</label>
                        <input type="text" x-model="form.media_url" class="w-full px-4 py-2 border rounded-lg" placeholder="https://...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Caption</label>
                        <input type="text" x-model="form.media_caption" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
            </template>

            <button @click="send" :disabled="sending" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold disabled:opacity-50">
                <span x-show="!sending">Kirim</span>
                <span x-show="sending">Mengirim...</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function sendMessage() {
    return {
        wabas: [],
        sending: false,
        error: '',
        successMsg: '',
        form: {
            waba_id: '', to: '', message_type: 'text',
            text: '', template_name: '', template_language: 'id',
            media_url: '', media_caption: ''
        },
        async loadWabas() {
            const res = await apiFetch('/client-portal/wabas');
            if (res) this.wabas = await res.json();
        },
        async send() {
            this.sending = true; this.error = ''; this.successMsg = '';
            try {
                const payload = {...this.form, waba_id: parseInt(this.form.waba_id)};
                const res = await apiFetch('/messages/send', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    this.error = data.detail || data.error || 'Gagal kirim';
                    return;
                }
                this.successMsg = `✅ Pesan terkirim! ID: ${data.message_id || '-'}`;
                this.form.text = '';
            } catch (e) {
                this.error = 'Error: ' + e.message;
            } finally {
                this.sending = false;
            }
        }
    }
}
</script>
{% endblock %}
