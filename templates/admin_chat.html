{% extends "layout_admin.html" %}
{% block title %}Chat Klien{% endblock %}
{% block content %}
<div x-data="adminChat()" x-init="init()" class="h-[calc(100vh-4rem)] flex bg-white rounded-xl shadow overflow-hidden">
    <!-- Sidebar -->
    <div class="w-80 border-r flex flex-col bg-gray-50">
        <div class="p-4 border-b bg-white">
            <h2 class="font-bold text-gray-800 mb-3">💬 Chat Klien</h2>
            <select x-model="filterStatus" @change="loadSessions()" class="w-full px-3 py-2 text-sm border rounded-lg">
                <option value="">Semua</option>
                <option value="waiting_admin">Menunggu Admin</option>
                <option value="in_progress">Berlangsung</option>
                <option value="waiting_otp">Menunggu OTP</option>
                <option value="completed">Selesai</option>
                <option value="rejected">Ditolak</option>
            </select>
        </div>
        <div class="flex-1 overflow-y-auto">
            <template x-if="sessions.length === 0">
                <div class="p-4 text-center text-gray-400 text-sm">Tidak ada chat.</div>
            </template>
            <template x-for="s in sessions" :key="s.id">
                <div @click="openSession(s.id)"
                    :class="selectedId === s.id ? 'bg-blue-100 border-l-4 border-blue-600' : 'hover:bg-gray-100'"
                    class="p-3 border-b cursor-pointer">
                    <div class="flex justify-between items-start">
                        <div class="font-semibold text-sm text-gray-800" x-text="getClientName(s.client_id)"></div>
                        <div class="text-xs text-gray-400" x-text="formatTimeShort(s.created_at)"></div>
                    </div>
                    <div class="text-xs text-gray-500 mt-1 font-mono" x-text="s.phone_number"></div>
                    <div class="mt-1">
                        <span :class="statusClass(s.status)" class="text-xs px-2 py-0.5 rounded" x-text="statusLabel(s.status)"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="flex-1 flex flex-col bg-[#f0f2f5]">
        <template x-if="!selectedId">
            <div class="flex-1 flex items-center justify-center text-gray-500">
                <div class="text-center">
                    <div class="text-5xl mb-2">💬</div>
                    <div>Pilih chat untuk mulai</div>
                </div>
            </div>
        </template>

        <template x-if="selectedId">
            <div class="flex flex-col h-full">
                <!-- Header -->
                <div class="bg-white border-b p-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold text-gray-800" x-text="currentSession?.client_name"></div>
                            <div class="text-xs text-gray-500" x-text="currentSession?.client_email"></div>
                            <div class="text-sm text-gray-700 mt-1">
                                <span class="font-mono" x-text="currentSession?.phone_number"></span>
                                <span class="mx-2">•</span>
                                <span :class="statusTextClass(currentSession?.status)" x-text="statusLabel(currentSession?.status)"></span>
                            </div>
                        </div>
                        <button @click="refresh" class="text-xs px-3 py-1 bg-gray-100 rounded hover:bg-gray-200">🔄</button>
                    </div>

                    <!-- Admin Actions -->
                    <template x-if="currentSession && ['waiting_admin', 'in_progress', 'waiting_otp'].includes(currentSession.status)">
                        <div class="flex gap-2 mt-3 flex-wrap">
                            <a href="https://business.facebook.com/latest/settings/whatsapp_account" target="_blank"
                                class="text-xs px-3 py-1 bg-purple-600 text-white rounded hover:bg-purple-700">
                                🔗 Buka Meta Business Suite
                            </a>
                            <button @click="requestOtp" :disabled="acting"
                                class="text-xs px-3 py-1 bg-orange-500 text-white rounded hover:bg-orange-600 disabled:opacity-50">
                                📱 Minta Kode OTP
                            </button>
                            <button @click="showComplete = true"
                                class="text-xs px-3 py-1 bg-green-600 text-white rounded hover:bg-green-700">
                                ✅ Selesaikan & Aktifkan WABA
                            </button>
                            <button @click="showReject = true"
                                class="text-xs px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">
                                ❌ Tolak
                            </button>
                        </div>
                    </template>
                </div>

                <!-- Messages -->
                <div class="flex-1 overflow-y-auto p-4 space-y-2" x-ref="messagesContainer">
                    <template x-for="m in messages" :key="m.id">
                        <div>
                            <template x-if="m.sender_role === 'system'">
                                <div class="text-center my-2">
                                    <span class="inline-block bg-yellow-100 text-yellow-800 text-xs px-3 py-1 rounded-full whitespace-pre-wrap max-w-lg" x-text="m.content"></span>
                                </div>
                            </template>
                            <template x-if="m.sender_role === 'admin'">
                                <div class="flex justify-end">
                                    <div class="max-w-md px-3 py-2 rounded-lg shadow bg-blue-500 text-white">
                                        <div class="text-sm whitespace-pre-wrap" x-text="m.content"></div>
                                        <div class="text-[10px] text-blue-100 text-right mt-1" x-text="formatTime(m.created_at)"></div>
                                    </div>
                                </div>
                            </template>
                            <template x-if="m.sender_role === 'client'">
                                <div class="flex justify-start">
                                    <div class="max-w-md px-3 py-2 rounded-lg shadow bg-white">
                                        <div class="text-xs text-gray-600 font-semibold mb-1" x-text="currentSession?.client_name"></div>
                                        <div class="text-sm whitespace-pre-wrap text-gray-800" x-text="m.content"></div>
                                        <div class="text-[10px] text-gray-500 text-right mt-1" x-text="formatTime(m.created_at)"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Input -->
                <template x-if="!['completed', 'rejected', 'closed'].includes(currentSession?.status)">
                    <div class="bg-white border-t p-3">
                        <div class="flex gap-2">
                            <textarea x-model="newMessage" @keydown.enter.prevent="send"
                                placeholder="Ketik pesan... (Enter untuk kirim)" rows="2"
                                class="flex-1 px-3 py-2 border rounded-lg resize-none focus:ring-2 focus:ring-blue-500"></textarea>
                            <button @click="send" :disabled="sending || !newMessage.trim()"
                                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 font-semibold">
                                <span x-show="!sending">Kirim</span>
                                <span x-show="sending">...</span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- Modal Complete WABA -->
    <div x-show="showComplete" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg">
            <h3 class="text-xl font-bold mb-4">Aktifkan WABA</h3>
            <template x-if="completeError">
                <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm" x-text="completeError"></div>
            </template>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium mb-1">Meta WABA ID *</label>
                    <input type="text" x-model="completeForm.meta_waba_id" placeholder="Contoh: 1770414730836441"
                        class="w-full px-4 py-2 border rounded-lg font-mono">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Phone Number ID *</label>
                    <input type="text" x-model="completeForm.meta_phone_number_id" placeholder="Contoh: 1234567890"
                        class="w-full px-4 py-2 border rounded-lg font-mono">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">API Manager (BM) *</label>
                    <select x-model="completeForm.api_manager_id" class="w-full px-4 py-2 border rounded-lg">
                        <option value="">-- Pilih API Manager --</option>
                        <template x-for="am in apiManagers" :key="am.id">
                            <option :value="am.id" x-text="`${am.name} (${am.max_waba_slots} slot)`"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Kode OTP (opsional)</label>
                    <input type="text" x-model="completeForm.otp_code" placeholder="Kode OTP dari klien"
                        class="w-full px-4 py-2 border rounded-lg font-mono">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button @click="showComplete = false" class="px-4 py-2 rounded-lg border">Batal</button>
                <button @click="completeWaba" :disabled="acting" class="px-4 py-2 rounded-lg bg-green-600 text-white disabled:opacity-50">
                    <span x-show="!acting">✅ Aktifkan WABA</span>
                    <span x-show="acting">Memproses...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Reject -->
    <div x-show="showReject" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Tolak Permintaan</h3>
            <textarea x-model="rejectReason" rows="3" placeholder="Alasan penolakan..."
                class="w-full px-4 py-2 border rounded-lg"></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button @click="showReject = false" class="px-4 py-2 rounded-lg border">Batal</button>
                <button @click="reject" class="px-4 py-2 rounded-lg bg-red-600 text-white">Tolak</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function adminChat() {
    return {
        sessions: [], messages: [], currentSession: null,
        selectedId: null, newMessage: '', sending: false,
        filterStatus: '',
        clients: [], apiManagers: [],
        showComplete: false, showReject: false, acting: false,
        completeForm: { meta_waba_id: '', meta_phone_number_id: '', api_manager_id: '', otp_code: '' },
        completeError: '',
        rejectReason: '',

        async init() {
            await this.loadClients();
            await this.loadApiManagers();
            await this.loadSessions();
            const urlParts = window.location.pathname.split('/');
            const sid = urlParts[urlParts.length - 1];
            if (sid && !isNaN(parseInt(sid))) {
                this.openSession(parseInt(sid));
            }
        },

        async loadClients() {
            const res = await apiFetch('/clients');
            if (res) this.clients = await res.json();
        },

        async loadApiManagers() {
            const res = await apiFetch('/api-managers');
            if (res) this.apiManagers = await res.json();
        },

        async loadSessions() {
            const url = this.filterStatus ? `/chat/admin/sessions?status_filter=${this.filterStatus}` : '/chat/admin/sessions';
            const res = await apiFetch(url);
            if (res) this.sessions = await res.json();
        },

        async openSession(id) {
            this.selectedId = id;
            await this.loadSessionDetail();
            if (this._interval) clearInterval(this._interval);
            this._interval = setInterval(() => {
                if (this.selectedId === id) this.loadSessionDetail();
            }, 5000);
        },

        async loadSessionDetail() {
            if (!this.selectedId) return;
            const res = await apiFetch(`/chat/admin/sessions/${this.selectedId}`);
            if (res) {
                const data = await res.json();
                const oldLen = this.messages.length;
                this.currentSession = data;
                this.messages = data.messages;
                if (this.messages.length > oldLen) {
                    this.$nextTick(() => this.scrollBottom());
                }
            }
        },

        async refresh() {
            await this.loadSessionDetail();
            await this.loadSessions();
        },

        scrollBottom() {
            const el = this.$refs.messagesContainer;
            if (el) el.scrollTop = el.scrollHeight;
        },

        getClientName(id) {
            const c = this.clients.find(x => x.id === id);
            return c ? c.name : `#${id}`;
        },

        async send() {
            if (!this.newMessage.trim()) return;
            this.sending = true;
            try {
                const res = await apiFetch(`/chat/admin/sessions/${this.selectedId}/messages`, {
                    method: 'POST',
                    body: JSON.stringify({ content: this.newMessage.trim() })
                });
                if (res.ok) {
                    this.newMessage = '';
                    await this.loadSessionDetail();
                    await this.loadSessions();
                }
            } finally { this.sending = false; }
        },

        async requestOtp() {
            this.acting = true;
            try {
                const res = await apiFetch(`/chat/admin/sessions/${this.selectedId}/action/request-otp`, { method: 'POST' });
                if (res.ok) {
                    await this.loadSessionDetail();
                    await this.loadSessions();
                }
            } finally { this.acting = false; }
        },

        async completeWaba() {
            this.acting = true; this.completeError = '';
            try {
                const payload = {
                    meta_waba_id: this.completeForm.meta_waba_id,
                    meta_phone_number_id: this.completeForm.meta_phone_number_id,
                    api_manager_id: parseInt(this.completeForm.api_manager_id),
                    otp_code: this.completeForm.otp_code || null,
                };
                const res = await apiFetch(`/chat/admin/sessions/${this.selectedId}/complete`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) { this.completeError = data.detail; return; }
                this.showComplete = false;
                this.completeForm = { meta_waba_id: '', meta_phone_number_id: '', api_manager_id: '', otp_code: '' };
                await this.loadSessionDetail();
                await this.loadSessions();
                if (!data.subscribe_ok) {
                    alert("WABA aktif tapi subscribe webhook gagal: " + (data.subscribe_error || 'Unknown'));
                }
            } finally { this.acting = false; }
        },

        async reject() {
            const res = await apiFetch(`/chat/admin/sessions/${this.selectedId}/reject`, {
                method: 'POST',
                body: JSON.stringify({ content: this.rejectReason })
            });
            if (res.ok) {
                this.showReject = false;
                this.rejectReason = '';
                await this.loadSessionDetail();
                await this.loadSessions();
            }
        },

        statusLabel(s) {
            return {
                waiting_admin: '⏳ Menunggu Admin',
                in_progress: '💬 Berlangsung',
                waiting_otp: '📱 Menunggu OTP',
                completed: '✅ Selesai',
                rejected: '❌ Ditolak',
                closed: '🔒 Ditutup',
            }[s] || s;
        },

        statusClass(s) {
            return {
                waiting_admin: 'bg-yellow-100 text-yellow-700',
                in_progress: 'bg-blue-100 text-blue-700',
                waiting_otp: 'bg-orange-100 text-orange-700',
                completed: 'bg-green-100 text-green-700',
                rejected: 'bg-red-100 text-red-700',
                closed: 'bg-gray-100 text-gray-700',
            }[s] || 'bg-gray-100 text-gray-700';
        },

        statusTextClass(s) {
            return {
                completed: 'text-green-600 font-semibold',
                rejected: 'text-red-600 font-semibold',
                waiting_otp: 'text-orange-600 font-semibold',
            }[s] || 'text-blue-600';
        },

        formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        },

        formatTimeShort(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) {
                return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            }
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
        }
    }
}
</script>
{% endblock %}
